name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - web-deploy
      - ui-overhaul-housekeeping
      - "codex/**"

jobs:
  app:
    name: App, Browser, and Tauri
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout BLine-Lib
        uses: actions/checkout@v6
        with:
          repository: edanliahovetsky/BLine-Lib
          ref: main
          path: .ci/BLine-Lib

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Release metadata check
        run: npm run release:check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Parity harness
        run: npm run parity

      - name: BLine-Lib IO compatibility
        env:
          BLINE_LIB_DIR: ${{ github.workspace }}/.ci/BLine-Lib
        run: npm run validate:bline-lib-io

      - name: Build web bundle
        run: npm run build

      - name: Browser smoke
        run: npm run test:e2e

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Tauri build
        run: npm run tauri:build
