name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - web-deploy
      - web-beta
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt packaging/publishing a promoted candidate.
  cancel-in-progress: ${{ github.ref != 'refs/heads/web-beta' && github.ref != 'refs/heads/web-deploy' }}

jobs:
  app:
    name: App, Browser, and Tauri
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout BLine-Lib
        uses: actions/checkout@v6
        with:
          repository: edanliahovetsky/BLine-Lib
          ref: main
          path: .ci/BLine-Lib

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Release metadata check
        run: npm run release:check

      - name: Release tooling tests
        run: npm run test:release

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and optimizer corpus acceptance
        env:
          BLINE_RUN_JOINT_PARITY_CORPUS: "1"
        run: npm run test

      - name: Parity harness
        run: npm run parity

      - name: BLine-Lib IO compatibility
        env:
          BLINE_LIB_DIR: ${{ github.workspace }}/.ci/BLine-Lib
        run: npm run validate:bline-lib-io

      - name: Build web bundle
        run: npm run build

      - name: Full browser suite
        run: npm run test:e2e

      - name: Beta toolbar and keyboard navigation
        run: npm run test:e2e:beta

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence-${{ github.workflow }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Offline browser and update recovery
        env:
          VITE_RELEASE_CHANNEL: ${{ github.ref_name == 'web-beta' && 'beta' || 'stable' }}
          VITE_ENABLE_BUG_REPORT: ${{ github.ref_name == 'web-beta' && 'true' || 'false' }}
        run: npm run test:offline

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Tauri build
        # Release branches already build and verify both Mac architectures below.
        if: github.ref != 'refs/heads/web-beta' && github.ref != 'refs/heads/web-deploy'
        run: npm run tauri:build

  windows-rust:
    name: Windows Rust storage
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Windows storage tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  release-artifacts:
    name: Release Artifacts
    if: github.event_name == 'push' && (github.ref == 'refs/heads/web-beta' || github.ref == 'refs/heads/web-deploy')
    uses: ./.github/workflows/release-web-deploy.yml

  release:
    name: Validated Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/web-beta' || github.ref == 'refs/heads/web-deploy')
    needs: [app, windows-rust, release-artifacts]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      candidate: ${{ needs.release-artifacts.outputs.candidate }}
      version: ${{ needs.release-artifacts.outputs.version }}
      tag: ${{ needs.release-artifacts.outputs.tag }}
      prerelease: ${{ needs.release-artifacts.outputs.prerelease }}
      releaseName: ${{ needs.release-artifacts.outputs.releaseName }}
