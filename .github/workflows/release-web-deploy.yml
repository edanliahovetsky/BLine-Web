name: Build Release Artifacts

# Called by CI at its immutable github.sha; artifact builds run alongside checks.
on:
  workflow_call:
    outputs:
      candidate:
        value: ${{ github.sha }}
      version:
        value: ${{ jobs.metadata.outputs.version }}
      tag:
        value: ${{ jobs.metadata.outputs.tag }}
      prerelease:
        value: ${{ jobs.metadata.outputs.prerelease }}
      releaseName:
        value: ${{ jobs.metadata.outputs.releaseName }}

permissions:
  contents: read

env:
  BLINE_RELEASE_CHANNEL: ${{ github.ref_name == 'web-beta' && 'beta' || 'stable' }}
  VITE_RELEASE_CHANNEL: ${{ github.ref_name == 'web-beta' && 'beta' || 'stable' }}
  VITE_ENABLE_BUG_REPORT: ${{ github.ref_name == 'web-beta' && 'true' || 'false' }}

jobs:
  metadata:
    name: Release Metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      releaseName: ${{ steps.metadata.outputs.releaseName }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Read release metadata
        id: metadata
        run: |
          npm run release:check
          npm run release:metadata

  web-artifact:
    name: Web Artifact
    runs-on: ubuntu-22.04
    needs:
      - metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release metadata check
        run: npm run release:check -- "${{ needs.metadata.outputs.tag }}"

      - name: Build web bundle
        run: npm run build

      - name: Zip web bundle
        run: |
          cd dist
          zip -r "../bline-web-web-${{ needs.metadata.outputs.version }}.zip" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web-dist
          path: bline-web-web-${{ needs.metadata.outputs.version }}.zip
          if-no-files-found: error

  desktop-artifacts:
    name: Desktop Artifact (${{ matrix.asset-prefix }})
    runs-on: ${{ matrix.platform }}
    needs:
      - metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            asset-prefix: macos-aarch64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: macos-latest
            asset-prefix: macos-x64
            args: --target x86_64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            asset-prefix: linux-x64
            args: ""
            rust-targets: ""
          - platform: windows-latest
            asset-prefix: windows-x64
            args: --config src-tauri/target/generated/tauri.windows-msi-version.json
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Release metadata check
        run: npm run release:check -- "${{ needs.metadata.outputs.tag }}"

      - name: Prepare Windows MSI version override
        if: matrix.platform == 'windows-latest'
        run: npm run release:windows-msi-config

      - name: Build Tauri bundle
        run: npm run ${{ github.ref_name == 'web-beta' && 'tauri:build:beta' || 'tauri:build' }} -- ${{ matrix.args }}

      - name: Verify macOS app signature
        if: startsWith(matrix.asset-prefix, 'macos-')
        shell: bash
        run: |
          app_path="$(
            find src-tauri/target -path "*/release/bundle/macos/*.app" -type d -print -quit
          )"
          if [[ -z "${app_path}" ]]; then
            echo "No macOS app bundle was produced."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"

      - name: Collect desktop assets
        shell: bash
        run: |
          mkdir -p desktop-assets
          while IFS= read -r -d '' file; do
            base="$(basename "${file}")"
            safe_base="$(
              printf '%s' "${base}" |
                tr '[:upper:]' '[:lower:]' |
                sed -E 's/[^a-z0-9._+-]+/-/g; s/^-+//; s/-+$//'
            )"
            cp "${file}" "desktop-assets/${{ matrix.asset-prefix }}-${safe_base}"
          done < <(
            find src-tauri/target -path "*/release/bundle/*" -type f \
              \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
              -print0
          )

          if ! find desktop-assets -type f -print -quit | grep -q .; then
            echo "No desktop release assets were produced."
            exit 1
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.asset-prefix }}
          path: desktop-assets/*
          if-no-files-found: error
