name: Phase 1 CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  app:
    name: App, Browser, and Tauri
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build web bundle
        run: npm run build

      - name: Browser smoke
        run: npm run test:e2e

      - name: Tauri build
        run: npm run tauri:build
